name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}


      - name: Create file on DigitalOcean server
        run: |
          ssh -o StrictHostKeyChecking=no ${{secrets.DIGITALOCEAN_USER}}@${{secrets.DIGITALOCEAN_HOST}} "echo 'Hello from GitHub Actions!' > /home/github-action-test.txt"

      # - name: Run deploy script on server
